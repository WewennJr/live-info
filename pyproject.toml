[project]
name = "live-info"
version = "0.1.0"
description = "Real-time dashboard for weather, GPS, speed tests, and system information"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "psutil>=7.2.2",
    "requests>=2.31",
]

[project.scripts]
live_info = "live_info.app:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
